<!-- OBSERVATIONS & NOTES PANEL -->
  <div id="notes-section">
    <div class="notes-header">
      <h3>📝 OBSERVATIONS &amp; NOTES</h3>
      <span id="saveStatus" style="font-size: 0.8rem; color: #28a745; font-weight: bold; opacity: 0; transition: opacity 0.3s;">Saved to browser ✓</span>
    </div>

    <div class="notes-grid">
      <div class="note-box">
        <label for="lion_q1">1. Which populations would you predict are more closely related to one another?</label>
        <textarea id="lion_q1" placeholder="Type observations here... (auto-saved)" oninput="saveNote('lion_q1')"></textarea>
      </div>

      <div class="note-box">
        <label for="lion_q2">2. Explain why you answered the previous question the way you did.</label>
        <textarea id="lion_q2" placeholder="Type explanation here... (auto-saved)" oninput="saveNote('lion_q2')"></textarea>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
      <button type="button" class="btn-download" onclick="downloadNotes()">📥 Download Notes (.txt)</button>
      <span style="font-size: 0.8rem; color: #718096; font-style: italic;">(Optional — for keeping a personal copy)</span>
    </div>
  </div>
