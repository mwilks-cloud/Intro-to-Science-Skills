<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lion Pride Geography Activity</title>

  <!-- Leaflet CSS -->
  <link 
    rel="stylesheet" 
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
    crossorigin="" 
  />

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      height: 100vh;
      background-color: #f4f6f8;
      color: #333;
    }

    #sidebar {
      width: 360px;
      padding: 20px;
      background: #ffffff;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      overflow-y: auto;
    }

    h2 {
      margin-top: 0;
      font-size: 1.25rem;
      color: #1a252f;
      border-bottom: 2px solid #0076D6;
      padding-bottom: 8px;
    }

    .instructions {
      font-size: 0.85rem;
      color: #555;
      line-height: 1.4;
      margin-bottom: 15px;
    }

    .coord-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .pride-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      background: #f8f9fa;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
    }

    .pride-info { font-size: 0.85rem; }
    .pride-info strong { display: flex; align-items: center; gap: 6px; color: #2d3748; }
    .pride-info span { color: #718096; font-size: 0.78rem; }

    .color-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: inline-block;
      border: 2px solid #ffffff;
      box-shadow: 0 0 3px rgba(0,0,0,0.4);
    }

    .btn-plot {
      background-color: #0076D6;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: bold;
    }

    .btn-plot.plotted { background-color: #28a745; }
    #map { flex: 1; height: 100%; }

    /* Custom Color Marker Badges on Map */
    .custom-pin-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background: white;
      padding: 3px 8px;
      border-radius: 12px;
      border: 2px solid #333;
      font-weight: bold;
      font-size: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="sidebar">
    <h2>📍 Lion Pride Locations</h2>
    <p class="instructions">
      Click <strong>Plot & Fly</strong> next to any coordinate to drop its color-coded badge and fly to its satellite scenery.
    </p>
    <div class="coord-list" id="coordList"></div>
  </div>

  <div id="map"></div>

  <!-- Leaflet JS -->
  <script 
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
    crossorigin="">
  </script>

  <script>
    // 10 Pride Locations with Unique High-Contrast Colors
    const prides = [
      { name: "Cameroon", lat: 8.1291, lng: 12.6226, color: "#e63946" },       // Red
      { name: "Tsavo", lat: -2.1833, lng: 38.4167, color: "#f4a261" },        // Orange
      { name: "Fannie Roberts", lat: -26.5225, lng: 31.4659, color: "#e76f51" }, // Coral
      { name: "Sabi Sands", lat: -24.7880, lng: 31.4914, color: "#2a9d8f" },    // Teal
      { name: "Umfolozi", lat: -28.3430, lng: 31.9743, color: "#264653" },     // Dark Cyan
      { name: "Zimbabwe", lat: -19.0154, lng: 29.1549, color: "#9b5de5" },     // Purple
      { name: "Zambia", lat: -13.1339, lng: 27.8493, color: "#f15bb5" },       // Pink
      { name: "Kalahari", lat: -25.5920, lng: 21.0937, color: "#00bbf9" },     // Light Blue
      { name: "Botswana", lat: -22.3285, lng: 24.6849, color: "#00f5d4" },     // Mint Green
      { name: "Etosha", lat: -18.8556, lng: 16.3293, color: "#ffb703" }        // Gold
    ];

    const map = L.map('map').setView([-5.0, 25.0], 4);

    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    const markers = {};
    const coordContainer = document.getElementById('coordList');

    prides.forEach((pride, index) => {
      const card = document.createElement('div');
      card.className = 'pride-card';
      card.innerHTML = `
        <div class="pride-info">
          <strong><span class="color-dot" style="background-color: ${pride.color}"></span> ${index + 1}. ${pride.name}</strong>
          <span>${pride.lat}, ${pride.lng}</span>
        </div>
        <button class="btn-plot" id="btn-${index}" onclick="plotPride(${index})">Plot & Fly</button>
      `;
      coordContainer.appendChild(card);
    });

    function plotPride(index) {
      const pride = prides[index];
      const btn = document.getElementById(`btn-${index}`);

      if (!markers[index]) {
        // Create custom badge icon with color dot + text label
        const badgeIcon = L.divIcon({
          className: '',
          html: `
            <div class="custom-pin-badge">
              <span class="color-dot" style="background-color: ${pride.color}"></span>
              <span>${pride.name}</span>
            </div>
          `,
          iconAnchor: [40, 15]
        });

        const marker = L.marker([pride.lat, pride.lng], { icon: badgeIcon }).addTo(map);
        marker.bindPopup(`<b>${pride.name} Pride</b><br>Lat: ${pride.lat}<br>Lng: ${pride.lng}`);
        markers[index] = marker;

        btn.textContent = "Plotted ✓";
        btn.classList.add("plotted");
      }

      map.flyTo([pride.lat, pride.lng], 10, { duration: 1.5 });
    }
  </script>
</body>
</html>
